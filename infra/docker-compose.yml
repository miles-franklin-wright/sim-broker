version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:latest
    ports:
      - "9092:9092"     # internal Docker clients
      - "29092:29092"   # external (host machine)
      - "9644:9644"     # admin API
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:29092
    volumes:
      - ../lake:/lake


  # optional: ensure heartbeat topic exists before producers/consumers start
  topic_init:
    image: redpandadata/redpanda:latest
    depends_on: [redpanda]
    entrypoint:
      - sh
      - -c
      - |
        # wait until metadata is available
        until rpk cluster metadata --brokers redpanda:9092; do
          echo "waiting for redpanda…"; sleep 1
        done
        rpk topic create heartbeat --brokers redpanda:9092 || true


  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY}
      ADMIN_USERNAME:        ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD:        ${SUPERSET_ADMIN_PASSWORD}
      ADMIN_EMAIL:           ${SUPERSET_ADMIN_EMAIL}
    depends_on:
      - postgres

  sim_broker:
    build: ../sim_broker
    command: python main.py
    environment:
      REDPANDA_BROKER: redpanda:9092
      HEARTBEAT_TOPIC:  heartbeat
    volumes:
      - ../lake:/lake
    depends_on:
      - redpanda
      - topic_init

  bytewax-bronze:
    build: ../bytewax
    container_name: bytewax-bronze
    # No need to specify python or -m here, the ENTRYPOINT covers that
    command: ["flows.heartbeat_flow:build_flow"]
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - HEARTBEAT_TOPIC=heartbeat
      - BRONZE_PATH=/lake/bronze/heartbeat.jsonl
    volumes:
      - ../lake:/lake
    depends_on:
      - redpanda
      - topic_init

  bytewax-silver:
    build: ../bytewax
    container_name: bytewax-silver
    # Again, only the import string
    command: ["flows.silver_heartbeat_flow:build_flow"]
    environment:
      - BRONZE_PATH=/lake/bronze/heartbeat.jsonl
      - SILVER_PATH=/lake/silver/heartbeat
      - BATCH_SIZE=100
    volumes:
      - ../lake:/lake
    depends_on:
      - bytewax-bronze

  compactor:
    image: python:3.12-slim
    container_name: compactor
    # mount both your lake data and your infra scripts
    volumes:
      - ../lake:/lake
      - ./compactor.py:/app/infra/compactor.py
      - ./__init__.py:/app/infra/__init__.py
    working_dir: /app/infra
    environment:
      - SILVER_PATH=/lake/silver/heartbeat
      - COMPACTION_INTERVAL_HOURS=1   # optional—defaults to 1 hour
    # run once immediately, then every hour
    command: >
      sh -c "
        python compactor.py;
        while sleep 3600; do
          python compactor.py;
        done
      "
    depends_on:
      - bytewax-silver
