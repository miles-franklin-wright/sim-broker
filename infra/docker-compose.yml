version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:latest
    ports:
      - "9092:9092"     # internal Docker clients
      - "29092:29092"   # external (host machine)
      - "9644:9644"     # admin API
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:29092
    volumes:
      - ../lake:/lake


  # optional: ensure heartbeat topic exists before producers/consumers start
  topic_init:
    image: redpandadata/redpanda:latest
    depends_on: [redpanda]
    entrypoint:
      - sh
      - -c
      - |
        # wait until metadata is available
        until rpk cluster metadata --brokers redpanda:9092; do
          echo "waiting for redpanda…"; sleep 1
        done
        rpk topic create heartbeat --brokers redpanda:9092 || true


  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY}
      ADMIN_USERNAME:        ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD:        ${SUPERSET_ADMIN_PASSWORD}
      ADMIN_EMAIL:           ${SUPERSET_ADMIN_EMAIL}
    depends_on:
      - postgres

  sim_broker:
    build: ../sim_broker
    command: python main.py
    environment:
      REDPANDA_BROKER: redpanda:9092
      HEARTBEAT_TOPIC:  heartbeat
    volumes:
      - ../lake:/lake
    depends_on:
      - redpanda
      - topic_init

  bytewax-bronze:
    build:
      context: ../flows
      dockerfile: Dockerfile
    container_name: bytewax-bronze
    environment:
      REDPANDA_BROKER: redpanda:9092
      HEARTBEAT_TOPIC: heartbeat
      BRONZE_PATH: /lake/bronze/heartbeat.jsonl
    volumes:
      - ../lake:/lake
    command:
      - --workers-per-process
      - "1"
      - flows.heartbeat_flow:build_flow()

  bytewax-silver:
    build:
      context: ../flows
      dockerfile: Dockerfile
    container_name: bytewax-silver
    environment:
      BRONZE_PATH: /lake/bronze/heartbeat.jsonl
      SILVER_FILE: /lake/silver/heartbeat/heartbeat.parquet
    volumes:
      - ../lake:/lake
    command:
      - --workers-per-process
      - "1"
      - flows.silver_heartbeat_flow:build_flow()

  parquet-loader:
    build:
      context: ..            # project root
      dockerfile: Dockerfile
    image: sim-broker-loader
    command: poetry run python loader/load_parquet.py
    environment:
      DB_DSN:     "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PARQUET_PATH: "/lake/silver/heartbeat/heartbeat.parquet"
    volumes:
      - ../lake:/lake
    depends_on:
      - postgres